# Optional project profile: source AFTER your ordinary project config, or copy
# these settings into it. No software/reference/index paths are changed here.
# CPU slots are admission estimates for the ENTIRE piped stage, not just BWA.
TOTAL_CPU_BUDGET="120"
TOTAL_MEMORY_GB="400"
# This is a ceiling: effective admission is also capped at 80% of available RAM.
MIN_AVAILABLE_MEMORY_GB="16"
THREADS_FASTP="8"
THREADS_ALIGN="32"
THREADS_SORT="4"
THREADS_COMPRESS="4"
THREADS_MERGE="8"
THREADS_MATRIX="24"
THREADS_BALANCE="24"
THREADS_HIC_NORM="16"
COOLTOOLS_THREADS="16"
PAIRTOOLS_SORT_MEMORY="16G"
PAIRTOOLS_MERGE_MEMORY="32G"
JAVA_HEAP="64g"
MAX_PARALLEL_ALIGNMENTS="2"
MAX_PARALLEL_FASTP="2"
MAX_PARALLEL_MERGES="1"
MAX_PARALLEL_DEDUP="2"
MAX_PARALLEL_FILTER="2"
MAX_PARALLEL_MATRIX="1"
MAX_PARALLEL_HIC="1"
MAX_PARALLEL_DOWNSTREAM="1"
MAX_PARALLEL_REPORTS="1"
MAX_PREPARED_SAMPLES="4"
MEMORY_FASTP_GB="8"
MEMORY_ALIGN_GB="80"
MEMORY_MERGE_GB="48"
MEMORY_DEDUP_GB="32"
MEMORY_FILTER_GB="32"
MEMORY_MATRIX_GB="96"
MEMORY_HIC_GB="80"
MEMORY_DOWNSTREAM_GB="64"
MEMORY_REPORT_GB="2"
BUILD_SAMPLE_MATRICES="false"
BUILD_BIOLOGICAL_MATRICES="true"
RUN_GROUPED_ROW_CONTACT_QC="false"
RUN_MERGE_TECHNICAL_REPLICATES="true"
HIC_OUTPUT_SCOPE="final"
# Select final_pool explicitly in the CSV; never assume every condition belongs
# in one pool. For an intentional legacy all-sample pool use the old switch.
RUN_MERGE_ALL_SAMPLES="false"
REUSE_SINGLE_LIBRARY_ARTIFACTS="true"
REUSE_RC4_OUTPUTS="true"
