# Micro-C / Hi-C matrix pipeline configuration.
# Copy this file to config/config.conf and edit paths for the server.

PIPELINE_NAME="microc2tracks"

# Output and temporary directories.
OUTDIR="results"
TMPDIR="/tmp/microc2tracks"

# Reference files. CHROM_SIZES must use the same chromosome names as the FASTA
# used for alignment. The legacy run showed that mismatched chr names can create
# empty coolers.
GENOME_ASSEMBLY="mm39"
REFERENCE_FASTA="/shared/references/mm39/GRCm39.primary_assembly.genome.fa"

# BWA-MEM2 index prefix. If the index was created with:
#   bwa-mem2 index "$REFERENCE_FASTA"
# then this should usually be identical to REFERENCE_FASTA.
# The pipeline passes this value to:
#   bwa-mem2 mem ... "$BWA_INDEX_PREFIX" R1 R2
BWA_INDEX_PREFIX="$REFERENCE_FASTA"

CHROM_SIZES="/shared/references/mm39/mm39.chrom.sizes"

# Juicer Tools is used for .hic creation because it matches the legacy script.
JUICER_TOOLS_JAR="/shared/software/juicer_tools/juicer_tools.2.18.00.jar"

# Contact filtering and matrix settings.
MAPQ_THRESHOLD="30"
BASE_RESOLUTION="1000"
RESOLUTIONS="1000,2000,5000,10000,25000,50000,100000,250000,500000,1000000,2500000,5000000,10000000"
MICROC_MIN_CIS_DIST="1000"
HIC_MIN_CIS_DIST="0"

# Filter matrices and .hic files to canonical chromosomes. This is strongly
# recommended for UCSC Genome Browser compatibility because random/alt/unplaced
# contigs can make .hic tracks harder to display reliably.
FILTER_CANONICAL_CHROMS="true"
CANONICAL_CHROMS_REGEX="^(chr)?([1-9][0-9]?|X|Y|M|MT)$"

# Tool parameters.
BWA_EXTRA_ARGS="-SP5M"
FASTP_EXTRA_ARGS="--detect_adapter_for_pe"

# Resource defaults for a 500 GB RAM, 70 physical core, 140 logical CPU server.
# Increase THREADS_MATRIX/MERGE for large merged datasets, but leave room for
# other users on shared systems.
THREADS_ALIGN="32"
THREADS_SORT="16"
THREADS_MATRIX="32"
THREADS_MERGE="64"
PAIRTOOLS_SORT_MEMORY="32G"
PAIRTOOLS_MERGE_MEMORY="128G"
JAVA_HEAP="256g"

# Pipeline switches.
RUN_FASTP="true"
RUN_MCOOL="true"
RUN_HIC="true"
RUN_MULTIQC="true"
RUN_MERGE_TECHNICAL_REPLICATES="true"

# Downstream defaults. These are used by scripts/run_downstream.sh.
COOLTOOLS_THREADS="16"
TAD_RESOLUTION="10000"
INSULATION_WINDOWS_BP="50000 100000 250000"
COMPARTMENT_RESOLUTION="100000"
LOOP_RESOLUTION="5000"
PHASING_TRACK=""

# Optional public web export for UCSC/Juicebox track lines.
# PUBLIC_HIC_BASE_URL should be the URL corresponding to PUBLIC_HIC_DIR.
# Example:
#   PUBLIC_HIC_DIR="/var/www/html/microc2tracks/hic"
#   PUBLIC_HIC_BASE_URL="https://your.server.org/microc2tracks/hic"
PUBLIC_HIC_DIR=""
PUBLIC_HIC_BASE_URL=""
