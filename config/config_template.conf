# Micro-C / Hi-C matrix pipeline configuration.
# Copy this file to config/config.conf and edit paths for the server.

PIPELINE_NAME="microc2tracks"
# fastq: normal workflow. refilter-deduplicated: import existing .pairs/.pairs.gz
# using the separate refilter sample sheet, without alignment or deduplication.
# --mode on microc2tracks.sh/preflight_check.sh overrides this setting.
WORKFLOW_MODE="fastq"

# Output and temporary directories.
OUTDIR="results"
TMPDIR=""
# Optional category roots. Empty means OUTDIR with the standard relative layout.
PAIRS_OUTDIR=""
MATRIX_OUTDIR=""
TRIMMED_OUTDIR=""
REFERENCE_CACHE_DIR=""
# Destination staging minimizes SSD use. scratch builds on TMPDIR, then verifies
# a copy before publishing on the destination disk. Empty TMPDIR -> OUTDIR/tmp.
LARGE_OUTPUT_STAGING="destination"
# Space reserves are safety margins, not accurate estimates of stage size.
MIN_FREE_OUTPUT_GB="10"
MIN_FREE_SCRATCH_GB="20"
STORAGE_CHECK_INTERVAL="5"
# Space-separated absolute mount points; quote paths containing spaces.
REQUIRED_STORAGE_MOUNTS=""

# Per-sample references are defined in one validated TSV registry. Paths in the
# shipped registry are examples and must be adapted to the server. Existing
# mouse-only configs remain compatible: when reference_genome is absent, mm39 is
# selected and the legacy variables below override the mm39 registry paths.
REFERENCE_REGISTRY="config/references.tsv"
DEFAULT_REFERENCE_ID="mm39"

# Legacy/default-reference compatibility values. CHROM_SIZES must use exactly
# the same chromosome names and lengths as REFERENCE_FASTA.fai.
GENOME_ASSEMBLY=""
REFERENCE_FASTA=""

# BWA-MEM2 index prefix. If the index was created with:
#   bwa-mem2 index "$REFERENCE_FASTA"
# then this should usually be identical to REFERENCE_FASTA.
# The pipeline passes this value to:
#   bwa-mem2 mem ... "$BWA_INDEX_PREFIX" R1 R2
BWA_INDEX_PREFIX="$REFERENCE_FASTA"

CHROM_SIZES=""

# Juicer Tools is used for .hic creation because it matches the legacy script.
JUICER_TOOLS_JAR="/shared/software/juicer_tools/juicer_tools.2.18.00.jar"

# Contact filtering and matrix settings.
MAPQ_THRESHOLD="30"
BASE_RESOLUTION="1000"
RESOLUTIONS="1000,2000,5000,10000,25000,50000,100000,250000,500000,1000000,2500000,5000000,10000000"
MCOOL_RESOLUTIONS="$RESOLUTIONS"
HIC_RESOLUTIONS="$RESOLUTIONS"
MICROC_MIN_CIS_DIST="1000"
HIC_MIN_CIS_DIST="0"
# The generic restriction profile requires an explicit enzyme for Hi-C rows.
# Old configs without HIC_PROTOCOL keep legacy Hi-C behavior and warn.
HIC_PROTOCOL="restriction_hic"
HIC_RESTRICTION_ENZYMES=""
HIC_REMOVE_SAME_FRAGMENT="true"
HIC_REMOVE_ADJACENT_INWARD="false"
HIC_PROTOCOL_REGISTRY="config/hic_protocols.json"

# No UMIs. Joint deduplication is selected only by sample-sheet dedup_group.
DEDUP_BACKEND="scipy"
DEDUP_METHOD="max"
DEDUP_MAX_MISMATCH="3"
DEDUP_CHUNKSIZE="10000"
DEDUP_CARRYOVER="100"
PAIRTOOLS_PARSE_MIN_MAPQ="1"
PAIRTOOLS_WALKS_POLICY="5unique"
PAIRTOOLS_MAX_INTER_ALIGN_GAP="20"
PAIRTOOLS_MAX_MOLECULE_SIZE="750"

# Filter matrices and .hic files to canonical chromosomes. This is strongly
# recommended for UCSC Genome Browser compatibility because random/alt/unplaced
# contigs can make .hic tracks harder to display reliably.
FILTER_CANONICAL_CHROMS="true"
CANONICAL_CHROMS_REGEX=""

# Tool parameters.
BWA_EXTRA_ARGS="-SP5M"
FASTP_EXTRA_ARGS="--detect_adapter_for_pe"

# FASTQ/fastp guardrails. CHECK_FASTQ_GZIP is used by preflight only and reads
# every .gz FASTQ fully, so enable it when troubleshooting suspicious inputs.
# FASTP_TIMEOUT_SECONDS=0 disables the timeout; set a large value such as
# 14400 for a 4-hour fail-fast guard on shared storage.
CHECK_FASTQ_GZIP="false"
FASTP_TIMEOUT_SECONDS="0"
# Optional full post-fastp check. This streams both trimmed FASTQs and fails
# before alignment if record counts or normalized read names differ.
CHECK_TRIMMED_FASTQ_SYNC="false"

# Conservative example resources, not a server-specific recommendation. Adjust
# to the machine; multiply per-worker memory/threads by concurrency limits.
THREADS_FASTP="8"
THREADS_ALIGN="8"
THREADS_SORT="4"
THREADS_MATRIX="4"
THREADS_MERGE="4"
THREADS_HIC_NORM="4"
PAIRTOOLS_SORT_MEMORY="8G"
PAIRTOOLS_MERGE_MEMORY="8G"
JAVA_HEAP="8g"
HIC_NORMALIZATIONS="VC,VC_SQRT,KR,SCALE"

# Limits are per run; separate runs still share the machine's resources.
MAX_PARALLEL_SAMPLES="1"
MAX_PARALLEL_FASTP="1"
MAX_PARALLEL_MATRIX="1"
MAX_PARALLEL_HIC="1"
MAX_PARALLEL_MERGES="1"
LOCK_POLL_SECONDS="5"

# Pipeline switches.
RUN_FASTP="true"
RUN_MCOOL="true"
RUN_HIC="true"
RUN_MULTIQC="true"
RUN_GLOBAL_MULTIQC="true"
RUN_FINAL_REPORT="true"
RUN_MERGE_TECHNICAL_REPLICATES="true"
RUN_MERGE_ALL_SAMPLES="false"
ALL_SAMPLES_MERGE_NAME="all_samples_merged"
BUILD_SAMPLE_MATRICES="true"
RUN_PRELIM_DOWNSTREAM="true"
BOOTSTRAP_SENTINELS="true"

# Retention policy for large reproducible intermediates. Raw FASTQ files are
# never deleted by the pipeline because they live outside OUTDIR.
KEEP_TRIMMED_FASTQ="false"
KEEP_SORTED_PAIRS="true"
KEEP_DEDUP_PAIRS="true"
KEEP_JUICER_PAIRS="false"
KEEP_SINGLE_RES_COOL="false"
KEEP_RAW_MCOOL="false"
KEEP_RAW_HIC="false"
KEEP_RAW_MERGED_PAIRS="false"
CLEAN_TMP_ON_SUCCESS="true"

# Downstream defaults. These are used by scripts/run_downstream.sh. If
# PHASING_TRACK is empty, compartment eigenvectors are still calculated, but the
# PC1 sign is arbitrary and should be oriented later with biological metadata.
COOLTOOLS_THREADS="16"
TAD_RESOLUTION="10000"
INSULATION_WINDOWS_BP="50000 100000 250000"
INSULATION_BEDGRAPH_TRACKLINE="true"
TAD_BOUNDARY_THRESHOLD="Li"
TAD_BOUNDARY_WINDOW_BP="100000"
TAD_MIN_SIZE_BP="40000"
TAD_MIN_BOUNDARY_STRENGTH=""
COMPARTMENT_RESOLUTION="100000"
LOOP_RESOLUTION="5000"
PHASING_TRACK=""

# Optional public web export for UCSC/Juicebox track lines.
# PUBLIC_HIC_BASE_URL should be the URL corresponding to PUBLIC_HIC_DIR.
# Example:
#   PUBLIC_HIC_DIR="/var/www/html/microc2tracks/hic"
#   PUBLIC_HIC_BASE_URL="https://your.server.org/microc2tracks/hic"
PUBLIC_HIC_DIR=""
PUBLIC_HIC_BASE_URL=""
